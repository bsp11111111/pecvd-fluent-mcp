<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
  <rect width="1000" height="440" fill="white"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="35" y="35" font-size="23">连接测试：轴对称极板间隙</text>
    <text x="35" y="65" font-size="16">几何示意，非场分布；不含论文匀流腔、多孔层、等离子体与化学反应</text>
    <rect x="110" y="160" width="740" height="95" fill="#e7f4f8" stroke="#263b56" stroke-width="2"/>
    <line x1="110" y1="160" x2="850" y2="160" stroke="#288da6" stroke-width="7"/>
    <line x1="110" y1="255" x2="783" y2="255" stroke="#c57228" stroke-width="7"/>
    <line x1="783" y1="255" x2="850" y2="255" stroke="#888" stroke-width="7"/>
    <line x1="110" y1="120" x2="110" y2="305" stroke="#444" stroke-dasharray="6 5"/>
    <text x="40" y="325" font-size="16">r=0，对称轴</text>
    <text x="310" y="135" font-size="17">等效喷淋入口：323 K；半径 165 mm</text>
    <text x="310" y="292" font-size="17">晶圆：673.15 K；半径 150 mm</text>
    <text x="792" y="320" font-size="15">边缘环</text>
    <text x="866" y="194" font-size="16">侧出口</text>
    <text x="866" y="219" font-size="15">2 Torr</text>
    <text x="350" y="215" font-size="16">15 mm 间隙；中性气体连接测试</text>
    <text x="35" y="370" font-size="16">Fluent x 为轴向 z，y 为径向 r；网格单位 m。</text>
    <text x="35" y="400" font-size="16">center_open：r&lt;75 mm 开；edge_open：r&gt;75 mm 开；baseline：全开。</text>
  </g>
</svg>
